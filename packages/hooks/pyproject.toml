[project]
name = "python-agent-tools-hooks"
version = "0.1.0"
description = "The Claude Code hooks for python-agent-tools"
readme = "README.md"
authors = [
    { name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" },
]
requires-python = ">=3.14"
dependencies = [
    "python-agent-tools-core",
]

[project.scripts]
python-agent-tools-hooks = "python_agent_tools_hooks:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
python-agent-tools-core = { workspace = true }
